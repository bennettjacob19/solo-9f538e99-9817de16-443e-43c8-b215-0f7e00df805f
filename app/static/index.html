<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制品目录历史查询</title>
<style>
  :root { --bd:#d0d7de; --bg:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin:0; color:#1f2328; }
  header { background:#24292f; color:#fff; padding:14px 24px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:#adbac7; font-size:12px; margin-top:4px; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px 24px; }
  .card { border:1px solid var(--bd); border-radius:8px; background:#fff; padding:14px 16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .full { grid-column: 1 / -1; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--bd); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:var(--bg); }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  input, select { width:100%; padding:5px 8px; border:1px solid var(--bd); border-radius:6px; font:inherit; }
  button { padding:6px 14px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); cursor:pointer; font:inherit; }
  button.primary { background:#0969da; color:#fff; border-color:#0969da; }
  button.danger { color:var(--err); }
  .row { display:grid; grid-template-columns:repeat(4, 1fr) auto; gap:8px; margin-bottom:8px; align-items:end; }
  .kv { display:grid; grid-template-columns: 160px 1fr; gap:4px 12px; font-size:13px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.STREAMING { background:#dafbe1; color:var(--ok); }
  .badge.INITIALIZING { background:#fff8c5; color:var(--warn); }
  .badge.ERROR { background:#ffebe9; color:var(--err); }
  .badge.conn { background:#dafbe1; color:var(--ok); }
  .badge.disc { background:#ffebe9; color:var(--err); }
  .muted { color:#656d76; font-size:12px; }
  .msg { margin-top:8px; font-size:13px; white-space:pre-wrap; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .point-row { cursor:pointer; }
  .point-row:hover { background:var(--bg); }
  .tag { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--bg); border:1px solid var(--bd); }
  .tag.DELETE { color:var(--err); border-color:var(--err); }
  .tag.INSERT, .tag.BASELINE { color:var(--ok); border-color:var(--ok); }
  .tag.UPDATE { color:#0969da; border-color:#0969da; }
  .tag.legacy { color:var(--warn); border-color:var(--warn); }
  .tag.ambig { color:var(--err); border-color:var(--err); }
</style>
</head>
<body>
<header>
  <h1>制品目录历史查询（PostgreSQL 逻辑复制 → SQLite 仅增日志）</h1>
  <div class="sub">每笔事务独立提交点 · 先落盘、后确认槽位 · 多行事务整体可见 · 删除后重用编号保留旧历史</div>
</header>
<main>
  <section class="card">
    <h2>① 捕获进度与续接状态</h2>
    <div class="kv" id="progress"><div class="muted">加载中…</div></div>
  </section>

  <section class="card">
    <h2>② 成组修改源目录（同一源事务提交）</h2>
    <div id="ops"></div>
    <div style="display:flex; gap:8px;">
      <button onclick="addOp('insert')">+ 新增</button>
      <button onclick="addOp('update')">+ 修改</button>
      <button onclick="addOp('delete')">+ 删除</button>
      <button class="primary" onclick="submitOps()">整组提交</button>
    </div>
    <div class="muted" style="margin-top:6px;">sha256 需 64 位十六进制；任一操作失败整组回滚。</div>
    <div class="msg" id="ops-msg"></div>
  </section>

  <section class="card full">
    <h2>③ 选择事务查看旧值（点击一行 = 回看该提交点整目录）</h2>
    <table>
      <thead><tr><th>序号</th><th>类型</th><th>提交点 LSN</th><th>源事务 xid</th><th>提交时间</th><th>变更行数</th><th>标记</th></tr></thead>
      <tbody id="points"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
    </table>
    <div style="display:flex; gap:8px; max-width:560px; margin-top:12px;">
      <input id="old-lsn" placeholder="旧链接 LSN（形如 0/16B3748），按 LSN 回看">
      <button onclick="viewByLsn()">按 LSN 查询</button>
    </div>
    <div class="muted" style="margin-top:4px;">旧版本可能把同批积压事务记成同一 LSN；遇歧义时会列出候选事务供逐笔选择。</div>
    <div id="dir-wrap" style="margin-top:14px;"></div>
  </section>

  <section class="card full">
    <h2>④ 单编号完整历史（含删除/重用）</h2>
    <div style="display:flex; gap:8px; max-width:420px;">
      <input id="hist-no" type="number" min="1" placeholder="制品编号，如 1001">
      <button onclick="loadHistory()">查询</button>
    </div>
    <div id="hist-wrap" style="margin-top:10px;"></div>
  </section>
</main>

<script>
const SHA = '0'.repeat(64);
let pointsCache = [];

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setMsg(id, text, cls=''){ const el=document.getElementById(id); el.textContent=text; el.className='msg '+cls; }

async function getJSON(url, opts){
  const r = await fetch(url, opts);
  const body = await r.json().catch(()=>({}));
  if (!r.ok) throw Object.assign(new Error(body.detail?.message || body.detail || r.statusText), {status:r.status, body});
  return body;
}

// ---------------------------------------------------------------- 进度与续接
async function refreshProgress(){
  try {
    const p = await getJSON('/api/progress');
    const conn = p.stream_connected
      ? '<span class="badge conn">已连接</span>'
      : '<span class="badge disc">已断开</span>';
    document.getElementById('progress').innerHTML = `
      <div>状态</div><div><span class="badge ${esc(p.phase)}">${esc(p.phase)}</span> ${conn}</div>
      <div>复制槽</div><div><code>${esc(p.slot_name ?? '-')}</code></div>
      <div>基线 LSN</div><div><code>${esc(p.baseline_lsn ?? '-')}</code></div>
      <div>最近提交点</div><div><code>${esc(p.last_commit_lsn ?? '-')}</code></div>
      <div>已确认落盘 LSN</div><div><code>${esc(p.last_confirmed_lsn ?? '-')}</code></div>
      <div>最近流消息 LSN</div><div><code>${esc(p.last_message_lsn ?? '-')}</code></div>
      <div>已捕获事务数</div><div>${p.captured_transactions ?? 0}</div>
      <div>历史日志行数</div><div>${p.history_rows ?? 0}</div>
      <div>累计接通次数</div><div>${p.connect_count ?? 0}</div>
      <div>最近接通时间</div><div class="muted">${esc(p.connected_at ?? '—')}</div>
      <div>最近断线时间</div><div class="muted">${esc(p.disconnected_at ?? '—')}</div>
      <div>存储版本</div><div>v${esc(p.schema_version ?? '?')}${p.migrated_at ? '（旧卷已于 '+esc(p.migrated_at)+' 原地升级）' : ''}</div>
      <div>最近错误</div><div>${p.last_error ? '<span style="color:var(--err)">'+esc(p.last_error)+'</span>' : '无'}</div>`;
  } catch(e){ document.getElementById('progress').innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}

// ------------------------------------------------------------- 成组修改
function opRow(type){
  const no = `<input class="f-no" type="number" min="1" placeholder="编号">`;
  const svc = `<input class="f-svc" placeholder="服务名">`;
  const ver = `<input class="f-ver" placeholder="版本">`;
  const sha = `<input class="f-sha" placeholder="SHA-256（64 hex）">`;
  let fields;
  if (type === 'delete') fields = `<div>${no}</div><div colspan="3" class="muted">删除无需其他字段</div>`;
  else fields = `<div>${no}</div><div>${svc}</div><div>${ver}</div><div>${sha}</div>`;
  return `<div class="row" data-type="${type}">
    <div><div class="muted">操作</div><select class="f-op" onchange="switchType(this)">
      <option value="insert" ${type==='insert'?'selected':''}>insert</option>
      <option value="update" ${type==='update'?'selected':''}>update</option>
      <option value="delete" ${type==='delete'?'selected':''}>delete</option></select></div>
    ${fields}
    <button class="danger" onclick="this.parentElement.remove()">×</button></div>`;
}
function addOp(type){ document.getElementById('ops').insertAdjacentHTML('beforeend', opRow(type)); }
function switchType(sel){
  const row = sel.closest('.row');
  const type = sel.value;
  row.outerHTML = opRow(type);
}
async function submitOps(){
  const operations = [];
  for (const row of document.querySelectorAll('#ops .row')) {
    const op = row.querySelector('.f-op').value;
    const no = Number(row.querySelector('.f-no')?.value);
    if (!no) return setMsg('ops-msg','每行都必须填写制品编号','err');
    if (op === 'delete') { operations.push({op, artifact_no:no}); continue; }
    const service_name = row.querySelector('.f-svc').value.trim();
    const version = row.querySelector('.f-ver').value.trim();
    const sha256 = row.querySelector('.f-sha').value.trim();
    if (!service_name || !version) return setMsg('ops-msg','服务名和版本不能为空','err');
    if (!/^[0-9a-fA-F]{64}$/.test(sha256)) return setMsg('ops-msg','sha256 必须是 64 位十六进制','err');
    operations.push({op, artifact_no:no, service_name, version, sha256});
  }
  if (!operations.length) return setMsg('ops-msg','请至少添加一行操作','err');
  try {
    const r = await getJSON('/api/source/operations', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({operations})
    });
    setMsg('ops-msg', `提交成功：新增 ${r.inserted} / 修改 ${r.updated} / 删除 ${r.deleted}`, 'ok');
    document.getElementById('ops').innerHTML='';
    refreshPoints();
  } catch(e){ setMsg('ops-msg', '提交失败（整组已回滚）：'+e.message, 'err'); }
}

// ---------------------------------------------------------------- 提交点
function pointBadges(p){
  let s = '';
  if (p.lsn_kind === 'recorded') s += '<span class="tag legacy">旧记录LSN</span> ';
  if (p.ambiguous) s += '<span class="tag ambig">LSN歧义</span>';
  return s || '<span class="muted">—</span>';
}

async function refreshPoints(){
  const tb = document.getElementById('points');
  try {
    const r = await getJSON('/api/points');
    pointsCache = r.points;
    if (!r.points.length) { tb.innerHTML='<tr><td colspan="7" class="muted">暂无提交点</td></tr>'; return; }
    tb.innerHTML = r.points.map(p => `
      <tr class="point-row" onclick="viewDirectory(${p.seq})">
        <td>${p.seq}</td>
        <td><span class="tag ${p.kind}">${esc(p.kind)}</span></td>
        <td><code>${esc(p.lsn)}</code></td>
        <td>${p.xid ?? '—'}</td>
        <td>${esc(p.commit_ts ?? '—')}</td>
        <td>${p.change_count}</td>
        <td>${pointBadges(p)}</td>
      </tr>`).join('');
  } catch(e){
    tb.innerHTML = `<tr><td colspan="7" class="msg err">${esc(e.status===503 ? '初始化未完成，历史暂不开放' : e.message)}</td></tr>`;
  }
}

function renderDirectory(info, rows){
  const legacy = info.lsn_kind === 'recorded'
    ? ' <span class="tag legacy">旧记录LSN（当时记录值，非伪造）</span>' : '';
  document.getElementById('dir-wrap').innerHTML = `
    <h3 style="font-size:14px;margin:6px 0;">提交点 #${info.seq}（${esc(info.kind)}）
      <code>${esc(info.lsn)}</code>${info.xid ? ' · xid '+info.xid : ''}${legacy}
      的整张目录（${rows.length} 行）</h3>
    <div class="muted" style="margin-bottom:6px;">只包含该事务及此前状态。</div>
    <table><thead><tr><th>制品编号</th><th>服务名</th><th>版本</th><th>SHA-256</th><th>来源</th></tr></thead>
    <tbody>${rows.map(a=>`<tr><td>${a.artifact_no}</td><td>${esc(a.service_name)}</td>
      <td>${esc(a.version)}</td><td><code>${esc(a.sha256)}</code></td>
      <td><span class="tag ${esc(a.change_type)}">${esc(a.change_type)}</span></td></tr>`).join('')
      || '<tr><td colspan="5" class="muted">该时刻目录为空</td></tr>'}</tbody></table>`;
}

async function viewDirectory(seq){
  try {
    const r = await getJSON('/api/directory?seq='+encodeURIComponent(seq));
    renderDirectory(r.point_info, r.artifacts);
  } catch(e){
    document.getElementById('dir-wrap').innerHTML = '<div class="msg err">'+esc(e.message)+'</div>';
  }
}

// 旧链接：按 LSN 回看；对应多笔事务时列出候选供逐笔选择
async function viewByLsn(){
  const lsn = document.getElementById('old-lsn').value.trim();
  if (!lsn) return;
  const wrap = document.getElementById('dir-wrap');
  try {
    const r = await getJSON('/api/directory?point='+encodeURIComponent(lsn));
    renderDirectory(r.point_info, r.artifacts);
  } catch(e){
    if (e.status === 409 && e.body.detail?.candidates){
      const cands = e.body.detail.candidates;
      wrap.innerHTML = `
        <div class="msg err">${esc(e.body.detail.message)}</div>
        <table style="margin-top:8px;"><thead><tr><th>序号</th><th>类型</th><th>xid</th><th>提交时间</th><th>变更行数</th><th></th></tr></thead>
        <tbody>${cands.map(c=>`<tr><td>${c.seq}</td><td><span class="tag ${c.kind}">${esc(c.kind)}</span></td>
          <td>${c.xid ?? '—'}</td><td>${esc(c.commit_ts ?? '—')}</td><td>${c.change_count}</td>
          <td><button onclick="viewDirectory(${c.seq})">查看该笔</button></td></tr>`).join('')}
        </tbody></table>`;
    } else {
      wrap.innerHTML = '<div class="msg err">'+esc(e.message)+'</div>';
    }
  }
}

// ---------------------------------------------------------------- 单编号历史
async function loadHistory(){
  const no = Number(document.getElementById('hist-no').value);
  if (!no) return;
  const wrap = document.getElementById('hist-wrap');
  try {
    const r = await getJSON('/api/history/'+no);
    if (!r.history.length) { wrap.innerHTML='<div class="muted">该编号没有任何历史记录</div>'; return; }
    wrap.innerHTML = `<table><thead><tr><th>顺序</th><th>变更</th><th>服务名</th><th>版本</th><th>SHA-256</th>
      <th>xid</th><th>提交点序号</th><th>提交点 LSN</th><th>捕获时间</th></tr></thead><tbody>
      ${r.history.map((h,i)=>`<tr><td>${i+1}</td><td><span class="tag ${esc(h.change_type)}">${esc(h.change_type)}</span></td>
        <td>${esc(h.service_name ?? '—')}</td><td>${esc(h.version ?? '—')}</td>
        <td><code>${esc(h.sha256 ?? '—')}</code></td><td>${h.xid ?? '—'}</td>
        <td>${h.seq ?? '—'}</td>
        <td><code>${esc(h.commit_lsn ?? '—')}</code></td><td class="muted">${esc(h.captured_at)}</td></tr>`).join('')}
      </tbody></table>`;
  } catch(e){ wrap.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; }
}

addOp('insert');
refreshProgress(); refreshPoints();
setInterval(refreshProgress, 3000);
setInterval(refreshPoints, 5000);
</script>
</body>
</html>
